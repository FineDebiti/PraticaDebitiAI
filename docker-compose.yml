services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pratica
      POSTGRES_PASSWORD: pratica
      POSTGRES_DB: pratica_debiti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratica"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - storage:/code/storage          # documenti (legacy)
      - filestore:/data/uploads        # volume DEDICATO e persistente per i file originali
    # Applica le migrazioni Alembic PRIMA di avviare l'app (niente più down -v).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      # Aspetta che il backend abbia applicato le migrazioni: niente race sullo schema.
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/code
      - storage:/code/storage
      - filestore:/data/uploads
    command: celery -A app.workers.celery_app worker --concurrency=1 --loglevel=info -Q default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pgdata:        # database Postgres
  filestore:     # file originali caricati
  storage:       # documenti legacy
