# =============================================================================
# Pratica Debiti AI - Installazione LOCALE OFFLINE (Windows)
# =============================================================================
# Differenze rispetto al docker-compose.yml di sviluppo:
#  - Nessun bind-mount del codice: le immagini sono self-contained (il codice e'
#    copiato dentro l'immagine in fase di build). Sul PC del cliente non servono
#    le cartelle sorgenti.
#  - Niente hot-reload: il frontend gira in build di produzione (next start) e il
#    backend senza --reload.
#  - Dati su volumi Docker nominati (pgdata/filestore/storage): restano sul PC
#    anche se i container vengono ricreati.
#  - db e redis NON espongono porte sull'host: parlano solo sulla rete interna,
#    cosi non vanno in conflitto con altri programmi del cliente.
#
# Avvio:  avvia.bat   (oppure: docker compose -f docker-compose.local.yml up -d --build)
# Stop:   ferma.bat   (oppure: docker compose -f docker-compose.local.yml down)
# =============================================================================
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pratica
      POSTGRES_PASSWORD: pratica
      POSTGRES_DB: pratica_debiti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratica"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - storage:/code/storage          # documenti (legacy)
      - filestore:/data/uploads        # file originali caricati
    # Applica le migrazioni Alembic e avvia l'app (produzione: niente --reload).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - storage:/code/storage
      - filestore:/data/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    # Il browser gira sullo stesso PC: l'API e' raggiungibile su localhost:8000.
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pgdata:        # database Postgres
  filestore:     # file originali caricati
  storage:       # documenti legacy
